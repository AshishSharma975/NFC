<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tfEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium Dark Squircle Background -->
  <rect width="128" height="128" rx="30" fill="url(#tfBg)" />
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#334155" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- NFC Wave / Contactless Tap Icon (Standard 45-deg Contactless Angle) -->
  <g transform="translate(64, 64) rotate(-45)" filter="url(#softGlow)">
    <!-- Central Pulse Dot -->
    <circle cx="0" cy="0" r="9.5" fill="#34d399" />

    <!-- Wave 1 (Inner) -->
    <path d="M 0 -22 A 22 22 0 0 1 22 0" fill="none" stroke="url(#tfEmerald)" stroke-width="7.5" stroke-linecap="round" />

    <!-- Wave 2 (Middle) -->
    <path d="M 0 -36 A 36 36 0 0 1 36 0" fill="none" stroke="url(#tfEmerald)" stroke-width="7.5" stroke-linecap="round" />

    <!-- Wave 3 (Outer) -->
    <path d="M 0 -50 A 50 50 0 0 1 50 0" fill="none" stroke="url(#tfEmerald)" stroke-width="7.5" stroke-linecap="round" />
  </g>
</svg>